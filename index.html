<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Al-Aqsa Prayer Times</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the next prayer as one burgundy slab beside the day's six times, a to-scale day band below, the full month one tab away. */
:root{
  color-scheme:dark;
  --charcoal:#222427; --charcoal-up:#2c2f33; --charcoal-top:#373a3f; --line:#44474c;
  --burgundy:#6e1a30; --burgundy-up:#872540; --rose:#e8aebb;
  --fg:#f3f1ef; --muted:#b5b3b1; --on-b:#fff6f3; --on-b-muted:#e9ccd2;
  --font:"Segoe UI","Segoe UI Web","Selawik",system-ui,-apple-system,"Noto Sans Arabic",sans-serif;
  --s-xs:.8125rem; --s-sm:.9375rem; --s-md:1.0625rem; --s-lg:1.375rem;
  --s:1;
}
[dir=rtl]{--s:-1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--charcoal);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.45}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.app{max-width:1120px;margin-inline:auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.num{font-variant-numeric:tabular-nums}
bdi{unicode-bidi:isolate}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{min-width:0}
.brand h1{margin:0;font-size:var(--s-lg);font-weight:600;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:var(--s-sm)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;align-items:center;gap:8px;min-height:44px;padding-inline:12px;background:var(--charcoal-up);border:1px solid var(--line);border-radius:8px}
.field span{color:var(--muted);font-size:var(--s-sm)}
.field select{background:transparent;border:0;min-height:42px;font-weight:600;max-width:190px}
.field select option,.field select optgroup{background:var(--charcoal-up);color:var(--fg)}
.field:focus-within{border-color:var(--rose)}
.seg{display:inline-flex;background:var(--charcoal-up);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{min-height:36px;min-width:44px;padding-inline:12px;background:none;border:0;border-radius:5px;cursor:pointer;color:var(--muted);font-size:var(--s-sm)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--charcoal-top);color:var(--fg);font-weight:600}

.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero{background:var(--burgundy);color:var(--on-b);border-radius:14px;padding:clamp(22px,4vw,36px);display:flex;flex-direction:column;justify-content:space-between;gap:28px;min-width:0}
.hero .where{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-size:var(--s-sm);color:var(--on-b-muted)}
.hero .label{font-size:var(--s-sm);color:var(--on-b-muted);margin:0}
.hero h2{margin:2px 0 0;font-size:clamp(3.25rem,9vw,5.75rem);font-weight:300;line-height:1.05;letter-spacing:-.015em}
[dir=rtl] .hero h2{letter-spacing:0;font-weight:400}
.hero .at{margin:8px 0 0;font-size:var(--s-lg)}
.count{font-size:clamp(2.25rem,6vw,3.25rem);font-weight:600;line-height:1;margin:6px 0 0}
html[dir=rtl] .count{text-align:right}

.sched{background:var(--charcoal-up);border-radius:14px;padding:clamp(14px,2.4vw,20px);min-width:0;display:flex;flex-direction:column;gap:12px}
.datebar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:6px}
.datebar .d{text-align:center;min-width:0}
.datebar strong{display:block;font-size:var(--s-md);font-weight:600}
.datebar small{display:block;color:var(--muted);font-size:var(--s-xs)}
.icon{width:44px;height:44px;border:1px solid var(--line);background:none;border-radius:8px;cursor:pointer;font-size:1.25rem;line-height:1}
.icon:hover{background:var(--charcoal-top)}
[dir=rtl] .icon svg{transform:scaleX(-1)}
.icon svg{display:block;margin:auto}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;min-height:50px;padding-inline:12px;border-radius:8px}
.rows .nm{font-size:var(--s-md);font-weight:600;min-width:0}
.rows .alt{color:var(--muted);font-size:var(--s-sm);font-weight:400;margin-inline-start:8px}
.rows .tm{font-size:var(--s-lg);font-weight:600;min-width:6.1ch;text-align:end;grid-column:3}
.rows .chip{grid-column:2;font-size:var(--s-xs);padding:2px 8px;border-radius:99px;white-space:nowrap}
.rows li.soft .nm,.rows li.soft .tm{font-weight:400;color:var(--muted)}
.rows li.past .nm,.rows li.past .tm{color:var(--muted);font-weight:400}
.rows li.cur{background:var(--charcoal-top)}
.rows li.cur .chip{border:1px solid var(--line);color:var(--fg)}
.rows li.next{background:var(--burgundy);color:var(--on-b)}
.rows li.next .alt{color:var(--on-b-muted)}
.rows li.next .chip{background:var(--on-b);color:var(--burgundy)}
.eid span:last-child{white-space:nowrap}
.eid{margin:0;padding-inline:12px;color:var(--muted);font-size:var(--s-sm);display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.back{align-self:center;background:none;border:0;color:var(--rose);min-height:32px;cursor:pointer;font-size:var(--s-sm);text-decoration:underline;text-underline-offset:3px}

.bandwrap{background:var(--charcoal-up);border-radius:14px;padding:16px clamp(14px,2.4vw,24px)}
.band{position:relative;height:124px}
.track{position:absolute;inset-inline:0;top:50%;height:10px;margin-top:-5px;background:var(--charcoal);border-radius:5px;overflow:hidden}
.daylight{position:absolute;top:0;bottom:0;background:var(--burgundy-up)}
.mk{position:absolute;top:50%;width:2px;height:22px;margin-top:-11px;margin-inline-start:-1px;background:var(--fg);border-radius:1px}
.nowmk{position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;margin-inline-start:-5px;background:var(--charcoal);border:2px solid var(--rose);border-radius:50%}
.lb{position:absolute;font-size:var(--s-xs);line-height:1.25;white-space:nowrap;text-align:center;transform:translateX(calc(-50% * var(--s)))}
.lb.a{bottom:calc(50% + 16px)}.lb.b{top:calc(50% + 16px)}
.lb.first{transform:none;text-align:start}.lb.last{transform:translateX(calc(-100% * var(--s)));text-align:end}
.lb b{display:block;font-weight:600}.lb i{font-style:normal;color:var(--muted)}

.tabs{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs h3{margin:0;font-size:var(--s-lg);font-weight:600}
.mnav{display:flex;align-items:center;gap:6px}
.mnav .title{min-width:9.5em;text-align:center;font-weight:600}
.tw{overflow-x:auto;background:var(--charcoal-up);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:0 12px;height:44px;text-align:end;vertical-align:middle;white-space:nowrap;border-bottom:1px solid var(--charcoal-top)}
thead th{height:48px;font-size:var(--s-sm);font-weight:600;color:var(--muted)}
th:first-child,td:first-child{text-align:start}
tbody tr:last-child td{border-bottom:0}
td.soft{color:var(--muted)}
.dbtn{background:none;border:0;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:40px;padding:0;text-align:start}
.dbtn b{font-weight:600;min-width:1.4em}.dbtn span{color:var(--muted);font-size:var(--s-sm)}
.dbtn:hover span{color:var(--fg)}
tr.sel td{background:var(--charcoal-top)}
tr.today td{background:var(--burgundy);color:var(--on-b);border-color:var(--burgundy)}
tr.today .dbtn span{color:var(--on-b-muted)}
tr.shift td{color:var(--rose);font-size:var(--s-sm);text-align:start;height:36px}

.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 32px;padding-top:12px;border-top:1px solid var(--line)}
.notes h3{margin:0 0 6px;font-size:var(--s-md);font-weight:600}
.notes p{margin:0 0 8px;color:var(--muted);font-size:var(--s-sm);max-width:62ch}
.notes dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:var(--s-sm)}
.notes dt{font-weight:600;white-space:nowrap}.notes dd{margin:0;color:var(--muted)}
@media (max-width:860px){
  .grid,.notes{grid-template-columns:minmax(0,1fr)}
  .top{align-items:stretch}.controls{width:100%}
  .field{flex:1 1 100%}.field select{flex:1;max-width:none}
  .seg{flex:1}.seg button{flex:1}
}
@media (max-width:640px){
  table{min-width:0}
  th,td{padding:0 4px;font-size:var(--s-sm)}
  thead th{font-size:.75rem}
  th:first-child,td:first-child{padding-inline-start:10px}
  th:last-child,td:last-child{padding-inline-end:10px}
  .ap,.dbtn span{display:none}
  .lb i{display:none}
  .band{height:92px}
}
@media (max-width:420px){.rows .alt{display:none}.rows li{padding-inline:10px}}
</style>

  if(isToday){for(let i=0;i<6;i++)if(t.epoch[i]<=st.n.ms)cur=i;nx=same(st.e.a,a)?st.e.i:-1}
  $("rows").innerHTML=t.wall.map((w,i)=>{
    const cls=[i===1?"soft":"",isToday&&i<cur?"past":"",i===nx?"next":"",i===cur&&i!==1?"cur":""].join(" ");
    const chip=i===nx?`<span class="chip">${L.nextChip}</span>`:(i===cur&&i!==1?`<span class="chip">${L.nowChip}</span>`:"");
    return `<li class="${cls}"><span class="nm">${pn(i)}<span class="alt" lang="${S.lang==="ar"?"en":"ar"}">${pn(i,S.lang==="ar"?"en":"ar")}</span></span>${chip}<bdi class="tm num">${fmt(w)}</bdi></li>`;
  }).join("");
  $("eidL").textContent=L.eid;$("eidV").textContent=fmt(t.eid);
  const b=$("band"),start=Math.floor((t.wall[0]-60)/60)*60,end=Math.ceil((t.wall[5]+60)/60)*60,pc=w=>((w-start)/(end-start)*100).toFixed(2)+"%";
  let h=`<div class="track"><div class="daylight" style="inset-inline-start:${pc(t.wall[1])};width:${((t.wall[4]-t.wall[1])/(end-start)*100).toFixed(2)}%"></div></div>`;
  t.wall.forEach((w,i)=>{h+=`<div class="mk" style="inset-inline-start:${pc(w)}"></div><div class="lb ${i%2?"b":"a"} ${i===0?"first":i===5?"last":""}" style="inset-inline-start:${pc(w)}"><b>${pn(i)}</b><i class="num"><bdi>${fmt(w)}</bdi></i></div>`});
  if(isToday){const nw=st.n.h*60+st.n.min;if(nw>=start&&nw<=end)h+=`<div class="nowmk" style="inset-inline-start:${pc(nw)}"></div>`}
  b.innerHTML=h;
}
function renderMonth(st){
  const c=CITIES[S.city],L=TX[S.lang],{y,m}=S.mon,days=new Date(Date.UTC(y,m,0)).getUTCDate();
  $("mTitle").textContent=L.month;$("mLabel").textContent=`${MON[S.lang][m-1]} ${y}`;
  $("mHead").innerHTML=`<tr><th scope="col">${L.day}</th>${P.map((_,i)=>`<th scope="col">${pn(i)}</th>`).join("")}</tr>`;
  let out="",prev=times(c,add({y,m,d:1},-1)).dst;
  for(let d=1;d<=days;d++){
    const a={y,m,d},t=times(c,a);
    if(t.dst!==prev){out+=`<tr class="shift"><td colspan="7">${t.dst?L.shiftOn:L.shiftOff}</td></tr>`;prev=t.dst}
    const cls=same(a,st.n.date)?"today":same(a,S.sel)?"sel":"";
    out+=`<tr class="${cls}"><td><button class="dbtn" type="button" data-d="${d}"><b>${d}</b><span>${weekday(a,"short")}</span></button></td>${t.wall.map((w,i)=>`<td class="${i===1&&cls!=="today"?"soft":""}"><bdi>${fmt(w).replace(/ (.+)$/,'<span class="ap"> $1</span>')}</bdi></td>`).join("")}</tr>`;
  }
  $("mBody").innerHTML=out;
}
function renderChrome(){
  const L=TX[S.lang],r=document.documentElement;
  r.lang=S.lang;r.dir=S.lang==="ar"?"rtl":"ltr";
  $("tName").textContent=L.name;$("tSub").textContent=L.sub;$("tCity").textContent=L.city;
  document.title="Al-Aqsa Prayer Times";
  $("f12").setAttribute("aria-pressed",!S.h24);$("f24").setAttribute("aria-pressed",S.h24);
  $("fmtSeg").setAttribute("aria-label",L.fmt);
  $("lEn").setAttribute("aria-pressed",S.lang==="en");$("lAr").setAttribute("aria-pressed",S.lang==="ar");
  $("prev").setAttribute("aria-label",L.prev);$("next").setAttribute("aria-label",L.nextD);
  $("mPrev").setAttribute("aria-label",L.pm);$("mNext").setAttribute("aria-label",L.nm);
  $("tw").setAttribute("aria-label",L.month);
  const g=GROUPS[S.lang],order=[0,-60,60,90,120,180,240];
  $("city").innerHTML=order.map(o=>`<optgroup label="${g[o]}">${CITIES.map((c,i)=>c[0]===o?`<option value="${i}" ${i===S.city?"selected":""}>${cn(c)}</option>`:"").join("")}</optgroup>`).join("");
  $("notes").innerHTML=L.hNotes.map(n=>`<div><h3>${n[0]}</h3>${n[1]}</div>`).join("");
  $("dl").innerHTML=order.map(o=>`<dt>${g[o]}</dt><dd>${CITIES.filter(c=>c[0]===o).map(cn).join(S.lang==="ar"?"، ":", ")}</dd>`).join("");
}
function full(){renderChrome();tick(true)}
function tick(force){
  const st=renderHero(),k=[st.n.date.y,st.n.date.m,st.n.date.d,st.n.h,st.n.min,S.city,S.lang,S.h24,S.sel&&S.sel.d,S.sel&&S.sel.m,S.sel&&S.sel.y,S.mon&&S.mon.m,S.mon&&S.mon.y,st.e.i].join();
  if(!S.sel){S.sel=st.n.date;S.mon={y:st.n.date.y,m:st.n.date.m}}
  if(force||k!==S.lastKey){renderDay(st);renderMonth(st);S.lastKey=k}
}
function select(a){S.sel=a;S.mon={y:a.y,m:a.m};tick(true)}
$("prev").onclick=()=>select(add(S.sel,-1));
$("next").onclick=()=>select(add(S.sel,1));
$("back").onclick=()=>select(nowIn(CITIES[S.city]).date);
$("mPrev").onclick=()=>{const a=ymd(S.mon.y,S.mon.m-1,1);S.mon={y:a.y,m:a.m};tick(true)};
$("mNext").onclick=()=>{const a=ymd(S.mon.y,S.mon.m+1,1);S.mon={y:a.y,m:a.m};tick(true)};
$("mBody").onclick=e=>{const b=e.target.closest("[data-d]");if(b){S.sel={y:S.mon.y,m:S.mon.m,d:+b.dataset.d};tick(true);$("app").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}};
$("city").onchange=e=>{S.city=+e.target.value;store.set("city",CITIES[S.city][2]);tick(true)};
$("f12").onclick=()=>{S.h24=false;store.set("h24","0");full()};
$("f24").onclick=()=>{S.h24=true;store.set("h24","1");full()};
$("lEn").onclick=()=>{S.lang="en";store.set("lang","en");full()};
$("lAr").onclick=()=>{S.lang="ar";store.set("lang","ar");full()};
full();
setInterval(()=>tick(false),1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick(true)});
</script>
